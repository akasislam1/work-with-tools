<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JPG to PDF Online – Combine Images into One PDF | Work With Tools</title>
<style>
/* Design tokens: change these to match your other tools */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --text:#1c2333; --muted:#667085;
  --primary:#2f5bea; --primary-dark:#2347c2; --border:#d9deea; --danger:#d63a3a;
  --radius:12px;
  --font:'Noto Sans Bengali','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10141f;--surface:#1a2030;--text:#e8ecf5;--muted:#97a1b8;--border:#2c3550;--primary:#5b82ff;--primary-dark:#7b9bff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
button,select{font:inherit;color:inherit}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;padding:12px 22px}
.btn.primary:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.drop{display:block;border:2px dashed var(--border);background:var(--surface);border-radius:var(--radius);padding:32px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.drop strong{display:block;font-size:1.1rem}
.drop span{color:var(--muted);font-size:.9rem}
.drop input{display:none}
#status{min-height:1.5em;margin:10px 0;color:var(--muted);font-size:.9rem}
#list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:8px;display:flex;flex-direction:column;gap:6px;user-select:none}
.card.dragging{opacity:.45;border-color:var(--primary)}
.thumb{height:120px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:8px;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;display:block;pointer-events:none}
.badge{position:absolute;top:4px;left:4px;background:var(--primary);color:#fff;border-radius:999px;min-width:24px;height:24px;font-size:.8rem;display:grid;place-items:center;padding:0 6px}
.row{display:flex;gap:4px}
.row button{flex:1;border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 0;cursor:pointer;font-size:1rem}
.row button:hover{border-color:var(--primary)}
.row .del:hover{border-color:var(--danger);color:var(--danger)}
.row .handle{cursor:grab;touch-action:none}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.opts{margin:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.opts select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
</style>
<meta name="description" content="Turn JPG, PNG and WEBP images into a single PDF. Reorder, rotate and set the page size. Free and runs in your browser.">
<meta name="theme-color" content="#1f4bd8">
<meta property="og:title" content="JPG to PDF Online – Combine Images into One PDF">
<meta property="og:description" content="Turn JPG, PNG and WEBP images into a single PDF. Reorder, rotate and set the page size. Free and runs in your browser.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<div class="wt-bar"><a class="wt-logo" href="/"><span class="wt-mark">W</span>Work With Tools</a><a class="wt-all" href="/">All tools</a></div>

<div class="wrap">
  <header>
    <h1 data-i18n="title"></h1>
    <button class="btn" id="langBtn" style="display:none" aria-hidden="true" tabindex="-1" type="button"></button>
  </header>
  <p class="sub" data-i18n="subtitle"></p>

  <label class="drop" id="drop">
    <strong data-i18n="dropTitle"></strong>
    <span data-i18n="dropHint"></span>
    <input type="file" id="file" accept="image/jpeg,image/png,image/webp" multiple>
  </label>

  <div id="status" role="status" aria-live="polite"></div>
  <ul id="list"></ul>
  <p class="empty" id="empty" data-i18n="empty"></p>

  <section class="opts">
    <label><span data-i18n="pageSize"></span>
      <select id="size">
        <option value="a4" data-i18n="a4"></option>
        <option value="letter" data-i18n="letter"></option>
        <option value="fit" data-i18n="fit"></option>
      </select>
    </label>
    <label><span data-i18n="orientation"></span>
      <select id="orient">
        <option value="auto" data-i18n="auto"></option>
        <option value="portrait" data-i18n="portrait"></option>
        <option value="landscape" data-i18n="landscape"></option>
      </select>
    </label>
    <label><span data-i18n="margin"></span>
      <select id="margin">
        <option value="0" data-i18n="mNone"></option>
        <option value="18" data-i18n="mSmall" selected></option>
        <option value="36" data-i18n="mMedium"></option>
        <option value="54" data-i18n="mLarge"></option>
      </select>
    </label>
  </section>

  <div class="actions">
    <button class="btn primary" id="make" type="button" disabled data-i18n="make"></button>
    <button class="btn" id="clear" type="button" disabled data-i18n="clear"></button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="script.js"></script>
<script src="../assets/tools.js"></script>
<script src="../assets/site.js"></script>
</body>
</html>
