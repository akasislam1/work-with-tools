<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF to JPG Online – Convert PDF Pages to Images | Work With Tools</title>
<style>
/* Design tokens: identical to the JPG to PDF tool */
:root{
  --bg:#f5f7fb; --surface:#ffffff; --text:#1c2333; --muted:#667085;
  --primary:#2f5bea; --primary-dark:#2347c2; --border:#d9deea; --danger:#d63a3a;
  --radius:12px;
  --font:'Noto Sans Bengali','Hind Siliguri',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10141f;--surface:#1a2030;--text:#e8ecf5;--muted:#97a1b8;--border:#2c3550;--primary:#5b82ff;--primary-dark:#7b9bff}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);line-height:1.5}
.wrap{max-width:900px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px}
h1{font-size:1.5rem;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
button,select{font:inherit;color:inherit}
.btn{border:1px solid var(--border);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer}
.btn:hover{border-color:var(--primary)}
.btn.primary{background:var(--primary);border-color:var(--primary);color:#fff;font-weight:600;padding:12px 22px}
.btn.primary:hover{background:var(--primary-dark)}
.btn:disabled{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.drop{display:block;border:2px dashed var(--border);background:var(--surface);border-radius:var(--radius);padding:32px 16px;text-align:center;cursor:pointer;transition:border-color .15s,background .15s}
.drop.over{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,var(--surface))}
.drop strong{display:block;font-size:1.1rem}
.drop span{color:var(--muted);font-size:.9rem}
.drop input{display:none}
#status{min-height:1.5em;margin:10px 0 4px;color:var(--muted);font-size:.9rem}
.bar{height:8px;background:var(--border);border-radius:999px;overflow:hidden;margin-bottom:12px;visibility:hidden}
.bar.on{visibility:visible}
.bar div{height:100%;width:0;background:var(--primary);transition:width .15s}
.toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;color:var(--muted);font-size:.9rem}
#list{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px}
.card{position:relative;display:flex;flex-direction:column;gap:6px;background:var(--surface);border:2px solid var(--border);border-radius:var(--radius);padding:8px;cursor:pointer;text-align:center;font-size:.85rem}
.card.sel{border-color:var(--primary)}
.card input{position:absolute;top:10px;left:10px;width:20px;height:20px;accent-color:var(--primary);cursor:pointer}
.thumb{height:150px;display:flex;align-items:center;justify-content:center;background:var(--bg);border-radius:8px;overflow:hidden}
.thumb img{max-width:100%;max-height:100%;display:block}
.empty{color:var(--muted);text-align:center;padding:20px 0}
.opts{margin:20px 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px}
.opts label{display:flex;flex-direction:column;gap:4px;font-size:.9rem;color:var(--muted)}
.opts select{padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.error{color:var(--danger)}
</style>
<meta name="description" content="Convert PDF pages to JPG or PNG images. Pick the pages you want and download them as a ZIP. Free and runs in your browser.">
<meta name="theme-color" content="#1f4bd8">
<meta property="og:title" content="PDF to JPG Online – Convert PDF Pages to Images">
<meta property="og:description" content="Convert PDF pages to JPG or PNG images. Pick the pages you want and download them as a ZIP. Free and runs in your browser.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<div class="wt-bar"><a class="wt-logo" href="/"><span class="wt-mark">W</span>Work With Tools</a><a class="wt-all" href="/">All tools</a></div>

<div class="wrap">
  <header>
    <h1 data-i18n="title"></h1>
    <button class="btn" id="langBtn" style="display:none" aria-hidden="true" tabindex="-1" type="button"></button>
  </header>
  <p class="sub" data-i18n="subtitle"></p>

  <label class="drop" id="drop">
    <strong data-i18n="dropTitle"></strong>
    <span data-i18n="dropHint"></span>
    <input type="file" id="file" accept="application/pdf,.pdf">
  </label>

  <div id="status" role="status" aria-live="polite"></div>
  <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"><div id="barFill"></div></div>

  <div class="toolbar">
    <span id="count"></span>
    <button class="btn" id="toggleAll" type="button" disabled></button>
  </div>
  <ul id="list"></ul>
  <p class="empty" id="empty" data-i18n="empty"></p>

  <section class="opts">
    <label><span data-i18n="quality"></span>
      <select id="quality">
        <option value="1.5" data-i18n="qStd"></option>
        <option value="3" data-i18n="qHigh"></option>
      </select>
    </label>
    <label><span data-i18n="format"></span>
      <select id="format">
        <option value="jpg" data-i18n="fmtJpg"></option>
        <option value="png" data-i18n="fmtPng"></option>
      </select>
    </label>
  </section>

  <button class="btn primary" id="convert" type="button" disabled data-i18n="convert"></button>
</div>

<!-- Library and worker must use the same version (3.11.174) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="script.js"></script>
<script src="../assets/tools.js"></script>
<script src="../assets/site.js"></script>
</body>
</html>
