<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pricing – Go Premium for unlimited use and no ads | Work With Tools</title>
<meta name="description" content="Compare the free plan with Premium: unlimited files, no daily limits and no ads. The free plan needs no sign-up.">
<meta name="theme-color" content="#1f4bd8">
<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .pm{max-width:960px;margin:0 auto;padding:0 20px;font-family:"Instrument Sans",system-ui,sans-serif;color:var(--wt-ink);line-height:1.55}
  .pm *{box-sizing:border-box}
  .pm-hero{padding:44px 0 6px;text-align:center}
  .pm-hero h1{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2rem,5vw,3rem);letter-spacing:-.03em;line-height:1.08}
  .pm-hero p{margin:12px auto 0;max-width:56ch;color:var(--wt-mut);font-size:1.06rem}
  .pm-toggle-wrap{display:flex;justify-content:center;margin:28px 0 22px}
  .pm-toggle{position:relative;display:inline-flex;background:#eef1f6;border:1px solid var(--wt-line);border-radius:999px;padding:4px}
  .pm-toggle button{border:0;background:none;font:inherit;font-weight:600;color:var(--wt-mut);padding:10px 22px;border-radius:999px;cursor:pointer}
  .pm-toggle button[aria-pressed=true]{background:#fff;color:var(--wt-ink);box-shadow:0 1px 4px rgba(12,26,58,.18)}
  .pm-toggle button:focus-visible,.pm-btn:focus-visible{outline:3px solid var(--wt-blue);outline-offset:2px}
  .pm-off{position:absolute;right:-12px;top:-14px;background:#b9f3d4;color:#0b5a33;font-size:.78rem;font-weight:800;padding:5px 9px;border-radius:999px}
  .pm-plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;max-width:820px;margin:0 auto}
  .pm-plan{border:1px solid var(--wt-line);border-radius:26px;padding:26px;background:#fff;display:flex;flex-direction:column;min-height:460px}
  .pm-plan.premium{background:#fff1cf;border-color:#f5d78a}
  .pm-ph{display:flex;align-items:center;gap:12px}
  .pm-ico{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#fdecec;flex:none}
  .pm-plan.premium .pm-ico{background:#f5a524}
  .pm-ico svg{width:26px;height:26px;fill:none;stroke:#0c1a3a;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .pm-ph h2{margin:0;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.6rem;letter-spacing:-.01em}
  .pm-price{margin-top:22px;min-height:92px}
  .pm-price .big{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:2.5rem;font-weight:800;letter-spacing:-.02em;line-height:1.1}
  .pm-price .big small{font-family:"Instrument Sans",system-ui,sans-serif;font-size:1rem;font-weight:500;color:var(--wt-mut)}
  .pm-price .sub{margin-top:6px;color:#4a5878}
  .pm-btn{display:block;width:100%;border:0;border-radius:11px;background:var(--wt-blue);color:#fff;font:inherit;font-weight:700;padding:13px 18px;cursor:pointer;text-align:center;text-decoration:none}
  .pm-btn:hover:not(:disabled){background:var(--wt-blue-d)}
  .pm-btn:disabled{opacity:.55;cursor:not-allowed}
  .pm-btn.free{background:#fff;color:#d12a2a;border:2px solid #d12a2a}
  .pm-btn.free:hover{background:#fff4f4}
  .pm-btn.gold{background:#fbbf24;color:#0c1a3a}
  .pm-btn.gold:hover:not(:disabled){background:#f5ae0a}
  .pm-btn.alt{background:#fff;color:var(--wt-ink);border:1px solid var(--wt-line)}
  .pm-btn.alt:hover:not(:disabled){background:var(--wt-tint)}
  .pm-btn.inline{display:inline-block;width:auto}
  .pm-btn.small{padding:7px 13px;font-size:.9rem;border-radius:9px}
  .pm-fl{margin:22px 0 8px;font-weight:700}
  .pm-list{margin:0;padding:0;list-style:none}
  .pm-list li{position:relative;padding:5px 0 5px 28px}
  .pm-list li::before{content:"";position:absolute;left:2px;top:11px;width:16px;height:9px;border-left:3px solid #2bb673;border-bottom:3px solid #2bb673;transform:rotate(-45deg) scale(.9)}
  .pm-card{background:#fff;border:1px solid var(--wt-line);border-radius:18px;padding:24px;margin:22px auto 0;max-width:820px}
  .pm-card h2{margin:0 0 10px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:1.35rem}
  .pm-card h3{margin:20px 0 6px;font-size:1.02rem}
  .pm-muted{color:var(--wt-mut)}
  .pm-small{font-size:.88rem}
  .pm-field{display:block;margin-top:12px}
  .pm-field span{display:block;font-weight:600;margin-bottom:4px;font-size:.92rem}
  .pm-field input[type=text]{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--wt-line);border-radius:10px;background:#fff;color:var(--wt-ink)}
  .pm-field input:focus-visible{outline:3px solid var(--wt-blue);outline-offset:2px}
  .pm-err{margin:16px auto 0;max-width:820px;padding:11px 14px;border-radius:10px;background:#fdecec;color:#a61e1e;border:1px solid #f3c4c4}
  .pm-ok{margin:16px auto 0;max-width:820px;padding:11px 14px;border-radius:10px;background:#e8f6ee;color:#17623a;border:1px solid #bfe3cd}
  .pm-info{margin:16px auto 0;max-width:820px;padding:11px 14px;border-radius:10px;background:var(--wt-tint);color:var(--wt-ink)}
  .pm-row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
  .pm-method{display:block;border:1px solid var(--wt-line);border-radius:12px;padding:12px 14px;margin-top:10px;cursor:pointer}
  .pm-method input{margin-right:8px;accent-color:var(--wt-blue)}
  .pm-method.sel{border-color:var(--wt-blue);background:var(--wt-tint)}
  .pm-detail{white-space:pre-wrap;word-break:break-word;background:#fff;border:1px dashed var(--wt-line);border-radius:10px;padding:10px 12px;margin-top:8px;font-weight:600}
  .pm-shot{margin-top:10px;max-width:240px;max-height:240px;border-radius:10px;border:1px solid var(--wt-line);display:block}
  .pm-badge{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.8rem;font-weight:700;background:var(--wt-tint);color:var(--wt-blue)}
  .pm-badge.ok{background:#e8f6ee;color:#17623a}
  .pm-badge.no{background:#fdecec;color:#a61e1e}
  .pm-badge.wait{background:#fff5e0;color:#8a5300}
  .pm-steps{margin:0;padding-left:20px}
  .pm-steps li{padding:3px 0}
  .pm-rl{margin:0;padding:0;list-style:none}
  .pm-rl li{padding:10px 0;border-bottom:1px solid var(--wt-line)}
  .pm-rl li:last-child{border-bottom:0}
  .pm-foot{height:20px}
  [hidden]{display:none!important}
</style>
</head>
<body class="wt-home">
<div class="wt-bar"><a class="wt-logo" href="/"><span class="wt-mark">W</span>Work With Tools</a><a class="wt-all" href="/">All tools</a></div>

<main class="pm">

  <div id="app" aria-live="polite"><p class="pm-muted" style="text-align:center">Loading…</p></div>

</main>

<script src="/assets/tools.js"></script>

      h('div', { class: 'pm-price' }, h('div', { class: 'big', text: 'Free' })),

  function premiumCard() {

  function how() {

        h('li', { text: 'Pick a payment method and send the amount shown.' }),
        h('li', { text: 'Upload a screenshot of your payment.' }),
        h('li', { text: 'We check it. Once approved you get an email and Premium starts. Refresh the website to see it.' })),
      h('p', { class: 'pm-muted pm-small' }, 'Premium does not renew by itself. When it ends, you go back to the free plan, and you can pay again any time.' + (S.contact ? ' Questions? ' : ''),
        S.contact ? h('a', { href: 'mailto:' + S.contact, text: S.contact }) : null));
  }

  function draw() {
    document.getElementById('intro').textContent = S.intro || 'Use every tool as much as you like, with no ads. You can always keep using the free plan without signing up.';
    app.replaceChildren();
    if (!S.enabled) {
      app.append(h('div', { class: 'pm-card' }, h('h2', { text: 'Premium is not open yet' }), h('p', { class: 'pm-muted', text: 'Please check back soon. All tools keep working for free in the meantime.' })));
      return;
    }
    var parts = [msgBox(), toggle(), h('div', { class: 'pm-plans' }, freeCard(), premiumCard())];
    if (S.user) parts.push(accountCard());
    parts.push(checkout(), mine(), how());
    app.append.apply(app, parts.filter(Boolean));
  }

  load().then(function () {
    var want = params.get('plan');
    if (want && S.plans[want]) S.billing = want;
    draw();
    if (want && S.plans[want] && S.available) {
      if (S.user) openCheckout(want); else location.replace(loginUrl(want));
    }
  });
})();
</script>
</body>
</html>
