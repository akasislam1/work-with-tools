<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rotate PDF Online – Turn PDF Pages Left or Right | Work With Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Design tokens: change these to match your other tools ===== */
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text: #1d2233;
      --muted: #6b7288;
      --border: #dfe3ee;
      --primary: #3b5bdb;
      --primary-dark: #2f49b3;
      --primary-soft: #eaefff;
      --danger: #c92a2a;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(29, 34, 51, 0.07);
      --font: "Inter", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }

    /* Header */
    .app-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .app-header h1 { margin: 0; font-size: 1.75rem; }
    .app-header p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

    /* Buttons */
    .btn {
      font: inherit; font-weight: 600; cursor: pointer;
      padding: 9px 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover { background: var(--primary-soft); border-color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn:focus-visible, .dropzone:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Dropzone */
    .dropzone {
      background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 64px 24px; text-align: center; cursor: pointer; box-shadow: var(--shadow);
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: var(--primary-soft); }
    .dropzone h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .dropzone p { margin: 0 0 18px; color: var(--muted); }
    .note { margin-top: 14px; color: var(--muted); font-size: 0.875rem; text-align: center; }

    .message { margin-top: 16px; padding: 12px 16px; border-radius: 8px; background: #fff0f0; color: var(--danger); border: 1px solid #ffc9c9; }

    /* Toolbar */
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 16px; box-shadow: var(--shadow);
      position: sticky; top: 8px; z-index: 5;
    }
    .file-info { min-width: 0; }
    .file-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36ch; }
    .file-meta { color: var(--muted); font-size: 0.875rem; }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    /* Thumbnail grid */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 16px; margin-top: 20px; }
    .card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px; display: flex; flex-direction: column; align-items: center; gap: 8px; box-shadow: var(--shadow);
    }
    .thumb { width: 170px; height: 170px; display: flex; align-items: center; justify-content: center; }
    .paper {
      display: flex; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
      transition: transform 0.25s ease;
    }
    .paper.loading { width: 106px; height: 150px; background: linear-gradient(90deg, #eceff6, #f7f8fc, #eceff6); }
    .paper canvas { display: block; }
    .page-label { font-size: 0.875rem; color: var(--muted); }
    .card-actions { display: flex; gap: 8px; }
    .icon-btn { min-width: 44px; padding: 6px 12px; font-size: 1.1rem; line-height: 1.2; }

    .status { margin-top: 12px; color: var(--muted); font-size: 0.875rem; min-height: 1.4em; }
    .hidden { display: none !important; }

    @media (prefers-reduced-motion: reduce) { .paper { transition: none; } }
    @media (max-width: 560px) {
      .app-header { flex-direction: column; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
    }
  </style>
<meta name="description" content="Rotate one page or every page of a PDF and download it. Free, private and runs in your browser.">

<meta property="og:title" content="Rotate PDF Online – Turn PDF Pages Left or Right">
<meta property="og:description" content="Rotate one page or every page of a PDF and download it. Free, private and runs in your browser.">

</head>
<body>
<div class="wt-bar"><a class="wt-logo" href="/"><span class="wt-mark">W</span>Work With Tools</a><a class="wt-all" href="/">All tools</a></div>

  <div class="container">
    <header class="app-header">
      <div>
        <h1 data-i18n="title"></h1>
        <p data-i18n="subtitle"></p>
      </div>
      <button class="btn" id="langToggle" style="display:none" aria-hidden="true" tabindex="-1" type="button"></button>
    </header>

    <!-- Upload view -->
    <section id="uploadView">
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <h2 data-i18n="dropTitle"></h2>
        <p data-i18n="dropHint"></p>
        <button class="btn btn-primary" id="chooseBtn" type="button" data-i18n="chooseFile"></button>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
      </div>
      <p class="note" data-i18n="privacyNote"></p>
    </section>

    <div id="errorBox" class="message hidden" role="alert"></div>

    <!-- Editor view -->
    <section id="editorView" class="hidden">
      <div class="toolbar">
        <div class="file-info">
          <div class="file-name" id="fileName"></div>
          <div class="file-meta" id="fileMeta"></div>
        </div>
        <div class="toolbar-actions">
          <button class="btn" id="rotateAllBtn" type="button" data-i18n="rotateAll"></button>
          <button class="btn" id="newFileBtn" type="button" data-i18n="newFile"></button>
          <button class="btn btn-primary" id="downloadBtn" type="button" data-i18n="download"></button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>
      <div class="grid" id="grid"></div>
    </section>
  </div>

  <!-- Libraries (loaded from cdnjs, pinned versions) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="script.js"></script>
<script src="../assets/tools.js"></script>
<script src="../assets/site.js"></script>
</body>
</html>
