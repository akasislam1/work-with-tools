<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Split PDF Online – Extract Pages or Split by Range | Work With Tools</title>
<style>
  /* ---- Theme: same variables as the Merge PDF tool ---- */
  :root {
    --bg: #f5f6fa;
    --card: #ffffff;
    --ink: #1c2433;
    --muted: #667085;
    --line: #dfe3ec;
    --accent: #3a5bd9;
    --accent-ink: #ffffff;
    --accent-soft: #eaeefc;
    --danger: #c0352b;
    --danger-soft: #fdeceb;
    --radius: 12px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "Noto Sans Bengali", Roboto, sans-serif;
    line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 24px 16px 0; }
  header { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 20px; }
  h1 { margin: 0; font-size: 1.6rem; }
  .sub { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .lang {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: 6px 14px; font: inherit; cursor: pointer;
  }
  .drop {
    display: block; text-align: center; cursor: pointer;
    background: var(--card); border: 2px dashed var(--line); border-radius: var(--radius);
    padding: 32px 16px; transition: border-color .15s, background .15s;
  }
  .drop:hover, .drop.over, .drop:focus-within { border-color: var(--accent); background: var(--accent-soft); }
  .drop strong { display: block; font-size: 1.05rem; }
  .drop span { color: var(--muted); font-size: .9rem; }
  .drop input { position: absolute; width: 1px; height: 1px; opacity: 0; }

  .filecard {
    display: flex; align-items: center; gap: 12px; justify-content: space-between;
    background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px;
  }
  .filecard .info { min-width: 0; }
  .fname { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .fmeta { color: var(--muted); font-size: .85rem; }
  .btn {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: .9rem; cursor: pointer; white-space: nowrap;
  }
  .btn:hover { background: var(--accent-soft); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }

  .errors { margin: 16px 0 0; padding: 0; list-style: none; display: grid; gap: 8px; }
  .errors li {
    display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
    background: var(--danger-soft); color: var(--danger);
    border: 1px solid #f3c4c0; border-radius: 10px; padding: 10px 12px; font-size: .92rem;
  }
  .errors button { border: 0; background: none; color: inherit; font-size: 1.2rem; line-height: 1; cursor: pointer; }

  .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin: 20px 0 12px; }
  .mode {
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 10px; padding: 10px 8px; font: inherit; font-size: .92rem; cursor: pointer;
  }
  .mode[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
  .panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
  .panel label.field { display: block; font-weight: 600; margin-bottom: 6px; }
  .panel input[type="text"] {
    width: 100%; font: inherit; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink);
  }
  .panel input[type="text"][aria-invalid="true"] { border-color: var(--danger); }
  .note { color: var(--muted); font-size: .88rem; margin: 8px 0 0; }
  .check { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: .92rem; }
  .selbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 10px; }
  .selbar .count { color: var(--muted); font-size: .9rem; margin-left: auto; }

  .thumbhead { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 0 8px; }
  .thumbhead h2 { margin: 0; font-size: 1.05rem; }
  .thumbhead span { color: var(--muted); font-size: .85rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 10px; padding-bottom: 24px; }
  .thumb {
    position: relative; border: 2px solid var(--line); background: var(--card); border-radius: 10px;
    padding: 6px 6px 22px; cursor: default; font: inherit; color: var(--ink); text-align: center;
  }
  .grid.selectable .thumb { cursor: pointer; }
  .grid.selectable .thumb:hover { border-color: var(--accent); }
  .thumb .box { background: #eef0f5; border-radius: 4px; overflow: hidden; aspect-ratio: 3 / 4; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: .8rem; }
  .thumb.ready .box { aspect-ratio: auto; background: none; }
  .thumb canvas { display: none; width: 100%; height: auto; }
  .thumb.ready canvas { display: block; box-shadow: 0 1px 4px rgba(28, 36, 51, .2); }
  .thumb.ready .ph { display: none; }
  .thumb .num { position: absolute; left: 0; right: 0; bottom: 3px; font-size: .8rem; color: var(--muted); }
  .thumb.hl, .thumb.sel { border-color: var(--accent); background: var(--accent-soft); }
  .thumb.sel::after {
    content: "✓"; position: absolute; top: 8px; right: 8px; width: 22px; height: 22px; border-radius: 50%;
    background: var(--accent); color: var(--accent-ink); font-size: .85rem; line-height: 22px; font-weight: 700;
  }

  .actionbar {
    position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--line);
    padding: 12px 0 calc(12px + env(safe-area-inset-bottom, 0px)); margin-top: 8px;
  }
  .inlineerr {
    background: var(--danger-soft); color: var(--danger); border: 1px solid #f3c4c0;
    border-radius: 10px; padding: 9px 12px; font-size: .92rem; margin-bottom: 10px;
  }
  .status { text-align: center; color: var(--muted); font-size: .9rem; margin-bottom: 8px; min-height: 1.3em; }
  progress { display: block; width: 100%; height: 6px; margin-bottom: 8px; accent-color: var(--accent); }
  .split {
    width: 100%; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-ink);
    font: inherit; font-weight: 600; font-size: 1.05rem; padding: 14px; cursor: pointer;
  }
  .split:disabled { opacity: .45; cursor: not-allowed; }
  button:focus-visible, .drop:focus-within, input:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .hidden, [hidden] { display: none !important; }
</style>
<meta name="description" content="Split a PDF by page range, into single pages, or pick the pages you need. Free, private and runs in your browser.">
<meta name="theme-color" content="#1f4bd8">
<meta property="og:title" content="Split PDF Online – Extract Pages or Split by Range">
<meta property="og:description" content="Split a PDF by page range, into single pages, or pick the pages you need. Free, private and runs in your browser.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<div class="wt-bar"><a class="wt-logo" href="/"><span class="wt-mark">W</span>Work With Tools</a><a class="wt-all" href="/">All tools</a></div>

<div class="wrap">
  <header>
    <div>
      <h1 data-i18n="title">Split PDF</h1>
      <p class="sub" data-i18n="subtitle"></p>
    </div>
    <button class="lang" id="langBtn" style="display:none" aria-hidden="true" tabindex="-1" type="button"></button>
  </header>

  <label class="drop" id="dropZone">
    <input type="file" id="fileInput" accept="application/pdf,.pdf">
    <strong data-i18n="dropTitle"></strong>
    <span data-i18n="dropHint"></span>
  </label>

  <div class="filecard hidden" id="fileCard">
    <div class="info">
      <div class="fname" id="fileName"></div>
      <div class="fmeta" id="fileMeta"></div>
    </div>
    <button class="btn" id="changeBtn" type="button" data-i18n="change"></button>
  </div>

  <ul class="errors" id="errors" role="alert"></ul>

  <div id="workspace" class="hidden">
    <div class="modes" role="group">
      <button class="mode" type="button" data-mode="range" data-i18n="modeRange"></button>
      <button class="mode" type="button" data-mode="each" data-i18n="modeEach"></button>
      <button class="mode" type="button" data-mode="select" data-i18n="modeSelect"></button>
    </div>

    <div class="panel" data-panel="range">
      <label class="field" for="rangeInput" data-i18n="rangeLabel"></label>
      <input type="text" id="rangeInput" autocomplete="off" inputmode="text" spellcheck="false">
      <p class="note" data-i18n="rangeNote"></p>
      <label class="check"><input type="checkbox" id="combineChk"><span data-i18n="combine"></span></label>
    </div>
    <div class="panel hidden" data-panel="each">
      <p class="note" id="eachInfo" style="margin:0"></p>
    </div>
    <div class="panel hidden" data-panel="select">
      <p class="note" style="margin:0" data-i18n="selectInfo"></p>
      <div class="selbar">
        <button class="btn" id="selAllBtn" type="button" data-i18n="selectAll"></button>
        <button class="btn" id="selNoneBtn" type="button" data-i18n="clearSel"></button>
        <span class="count" id="selCount"></span>
      </div>
    </div>

    <div class="thumbhead">
      <h2 data-i18n="pagesTitle"></h2>
      <span id="thumbProgress"></span>
    </div>
    <div class="grid" id="grid"></div>

    <div class="actionbar">
      <div class="inlineerr hidden" id="actionError" role="alert"></div>
      <progress id="bar" max="100" value="0" hidden></progress>
      <div class="status" id="status" aria-live="polite"></div>
      <button class="split" id="splitBtn" type="button"></button>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="script.js"></script>
<script src="../assets/tools.js"></script>
<script src="../assets/site.js"></script>
</body>
</html>
