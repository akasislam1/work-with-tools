<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Add Watermark to PDF Online – Text or Logo | Work With Tools</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;600;700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== Design tokens: identical to the other PDF tools ===== */
    :root {
      --bg: #f5f6fa;
      --surface: #ffffff;
      --text: #1d2233;
      --muted: #6b7288;
      --border: #dfe3ee;
      --primary: #3b5bdb;
      --primary-dark: #2f49b3;
      --primary-soft: #eaefff;
      --danger: #c92a2a;
      --radius: 12px;
      --shadow: 0 2px 10px rgba(29, 34, 51, 0.07);
      --font: "Inter", "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }
    body { margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.6; }
    .container { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; }

    /* Header */
    .app-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; margin-bottom: 24px; }
    .app-header h1 { margin: 0; font-size: 1.75rem; }
    .app-header p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }

    /* Buttons */
    .btn {
      font: inherit; font-weight: 600; cursor: pointer;
      padding: 9px 16px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--surface); color: var(--text);
      transition: background 0.15s, border-color 0.15s;
    }
    .btn:hover:not(:disabled) { background: var(--primary-soft); border-color: var(--primary); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }
    .btn:focus-visible, .dropzone:focus-visible, .pos-btn:focus-visible, input:focus-visible, select:focus-visible {
      outline: 3px solid var(--primary); outline-offset: 2px;
    }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Dropzone */
    .dropzone {
      background: var(--surface); border: 2px dashed var(--border); border-radius: var(--radius);
      padding: 64px 24px; text-align: center; cursor: pointer; box-shadow: var(--shadow);
      transition: border-color 0.15s, background 0.15s;
    }
    .dropzone:hover, .dropzone.dragover { border-color: var(--primary); background: var(--primary-soft); }
    .dropzone h2 { margin: 0 0 6px; font-size: 1.25rem; }
    .dropzone p { margin: 0 0 18px; color: var(--muted); }
    .note { margin-top: 14px; color: var(--muted); font-size: 0.875rem; text-align: center; }
    .message { margin-top: 16px; padding: 12px 16px; border-radius: 8px; background: #fff0f0; color: var(--danger); border: 1px solid #ffc9c9; }

    /* Toolbar */
    .toolbar {
      display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 12px 16px; box-shadow: var(--shadow); position: sticky; top: 8px; z-index: 5;
    }
    .file-info { min-width: 0; }
    .file-name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 36ch; }
    .file-meta { color: var(--muted); font-size: 0.875rem; }
    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }
    .status { margin-top: 12px; color: var(--muted); font-size: 0.875rem; min-height: 1.4em; }

    /* Settings + preview layout */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 440px; gap: 20px; align-items: start; }
    .panel, .preview {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px; box-shadow: var(--shadow);
    }
    .field { margin-bottom: 16px; }
    .field > label, .field > .label { display: block; font-weight: 600; margin-bottom: 6px; }
    input[type="text"], select {
      width: 100%; font: inherit; padding: 9px 12px;
      border: 1px solid var(--border); border-radius: 8px; background: var(--surface); color: var(--text);
    }
    input[type="text"]:disabled { opacity: 0.5; }
    input[type="color"] { width: 100%; height: 44px; padding: 4px; border: 1px solid var(--border); border-radius: 8px; background: var(--surface); cursor: pointer; }
    input[type="range"] { flex: 1; min-width: 0; accent-color: var(--primary); }
    .range-wrap { display: flex; align-items: center; gap: 12px; }
    .range-wrap output { min-width: 4.5rem; text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .check { display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; }
    .check input { width: 18px; height: 18px; accent-color: var(--primary); }
    .radio-line { display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 8px; }
    .radio-line label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    .radio-line input { accent-color: var(--primary); }
    .hint { margin: 6px 0 0; color: var(--muted); font-size: 0.875rem; }
    .range-error { margin-top: 6px; color: var(--danger); font-size: 0.875rem; }
    .summary { font-weight: 600; }
    .file-line { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
    .file-line span { color: var(--muted); font-size: 0.875rem; overflow-wrap: anywhere; }

    /* Segmented control (Text / Image) */
    .seg { display: flex; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 3px; margin-bottom: 16px; }
    .seg label { position: relative; flex: 1; }
    .seg input { position: absolute; opacity: 0; inset: 0; }
    .seg span { display: block; text-align: center; padding: 7px 10px; border-radius: 6px; cursor: pointer; font-weight: 600; color: var(--muted); }
    .seg input:checked + span { background: var(--primary); color: #fff; }
    .seg input:focus-visible + span { outline: 3px solid var(--primary); outline-offset: 2px; }

    /* 3 x 3 position picker drawn as a mini page, plus a diagonal option */
    .pos-picker {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
      width: 210px; padding: 10px; background: #fff; border: 1px solid var(--border);
      border-radius: 8px; box-shadow: var(--shadow);
    }
    .pos-btn { height: 34px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); cursor: pointer; }
    .pos-btn:hover { border-color: var(--primary); background: var(--primary-soft); }
    .pos-btn[aria-checked="true"] { background: var(--primary); border-color: var(--primary); }
    .pos-diagonal { grid-column: 1 / -1; height: auto; padding: 6px 8px; font: inherit; font-size: 0.875rem; font-weight: 600; color: var(--text); }
    .pos-diagonal[aria-checked="true"] { color: #fff; }

    /* Live preview */
    .preview { position: sticky; top: 88px; }
    .preview-title { font-weight: 600; margin-bottom: 10px; }
    .preview-stage { display: flex; justify-content: center; background: var(--bg); border-radius: 8px; padding: 16px; }
    .preview-paper { position: relative; display: flex; background: #fff; box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18); }
    .preview-paper.loading { width: 280px; height: 380px; background: linear-gradient(90deg, #eceff6, #f7f8fc, #eceff6); }
    .preview-paper canvas { display: block; }
    .preview-paper canvas.overlay { position: absolute; left: 0; top: 0; pointer-events: none; }

    .hidden { display: none !important; }
    @media (max-width: 860px) {
      .layout { grid-template-columns: 1fr; }
      .preview { position: static; }
    }
    @media (max-width: 560px) { .app-header { flex-direction: column; } }
  </style>
<meta name="description" content="Stamp a text or logo watermark on every page of a PDF. Free, private and runs in your browser.">
<meta name="theme-color" content="#1f4bd8">
<meta property="og:title" content="Add Watermark to PDF Online – Text or Logo">
<meta property="og:description" content="Stamp a text or logo watermark on every page of a PDF. Free, private and runs in your browser.">
<link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../assets/site.css">
</head>
<body>
<div class="wt-bar"><a class="wt-logo" href="/"><span class="wt-mark">W</span>Work With Tools</a><a class="wt-all" href="/">All tools</a></div>

  <div class="container">
    <header class="app-header">
      <div>
        <h1 data-i18n="title"></h1>
        <p data-i18n="subtitle"></p>
      </div>
      <button class="btn" id="langToggle" style="display:none" aria-hidden="true" tabindex="-1" type="button"></button>
    </header>

    <!-- Upload view -->
    <section id="uploadView">
      <div class="dropzone" id="dropzone" tabindex="0" role="button">
        <h2 data-i18n="dropTitle"></h2>
        <p data-i18n="dropHint"></p>
        <button class="btn btn-primary" id="chooseBtn" type="button" data-i18n="chooseFile"></button>
        <input type="file" id="fileInput" accept="application/pdf,.pdf" hidden>
      </div>
      <p class="note" data-i18n="privacyNote"></p>
    </section>

    <div id="errorBox" class="message hidden" role="alert"></div>

    <!-- Editor view -->
    <section id="editorView" class="hidden">
      <div class="toolbar">
        <div class="file-info">
          <div class="file-name" id="fileName"></div>
          <div class="file-meta" id="fileMeta"></div>
        </div>
        <div class="toolbar-actions">
          <button class="btn" id="newFileBtn" type="button" data-i18n="newFile"></button>
          <button class="btn btn-primary" id="downloadBtn" type="button" data-i18n="download"></button>
        </div>
      </div>
      <div class="status" id="status" aria-live="polite"></div>

      <div class="layout">
        <div class="panel">
          <!-- Watermark type -->
          <div class="seg" role="radiogroup" id="modeGroup">
            <label><input type="radio" name="mode" value="text" checked><span data-i18n="typeText"></span></label>
            <label><input type="radio" name="mode" value="image"><span data-i18n="typeImage"></span></label>
          </div>

          <!-- Text options -->
          <div id="textGroup">
            <div class="field">
              <label for="wmText" data-i18n="text"></label>
              <input type="text" id="wmText" value="CONFIDENTIAL" maxlength="60" autocomplete="off">
            </div>
            <div class="field">
              <label for="fontSize" data-i18n="fontSize"></label>
              <div class="range-wrap">
                <input type="range" id="fontSize" min="10" max="200" step="1" value="48">
                <output id="fontSizeOut" for="fontSize"></output>
              </div>
            </div>
            <div class="field">
              <label for="color" data-i18n="color"></label>
              <input type="color" id="color" value="#888888">
            </div>
          </div>

          <!-- Image options -->
          <div id="imageGroup" class="hidden">
            <div class="field">
              <span class="label" data-i18n="logo"></span>
              <div class="file-line">
                <button class="btn" id="logoBtn" type="button" data-i18n="chooseLogo"></button>
                <span id="logoName"></span>
              </div>
              <input type="file" id="logoInput" accept="image/png,image/jpeg" hidden>
              <div class="range-error hidden" id="logoError" role="alert"></div>
            </div>
            <div class="field">
              <label for="sizePct" data-i18n="size"></label>
              <div class="range-wrap">
                <input type="range" id="sizePct" min="5" max="100" step="1" value="30">
                <output id="sizePctOut" for="sizePct"></output>
              </div>
            </div>
          </div>

          <!-- Shared options -->
          <div class="field">
            <label for="opacity" data-i18n="opacity"></label>
            <div class="range-wrap">
              <input type="range" id="opacity" min="5" max="100" step="1" value="30">
              <output id="opacityOut" for="opacity"></output>
            </div>
          </div>

          <div class="field">
            <span class="label" id="posLabel" data-i18n="position"></span>
            <div class="pos-picker" id="posPicker" role="radiogroup" aria-labelledby="posLabel"></div>
            <div class="hint hidden" id="tileHint" data-i18n="tileHint"></div>
          </div>

          <div class="field">
            <label class="check"><input type="checkbox" id="tile"><span data-i18n="tile"></span></label>
          </div>
          <div class="field hidden" id="gapField">
            <label for="gap" data-i18n="tileGap"></label>
            <div class="range-wrap">
              <input type="range" id="gap" min="0" max="300" step="5" value="80">
              <output id="gapOut" for="gap"></output>
            </div>
          </div>

          <!-- Page selection -->
          <div class="field">
            <span class="label" data-i18n="pagesLabel"></span>
            <div class="radio-line" role="radiogroup">
              <label><input type="radio" name="pagesMode" value="all" checked><span data-i18n="pagesAll"></span></label>
              <label><input type="radio" name="pagesMode" value="specific"><span data-i18n="pagesSpecific"></span></label>
            </div>
            <input type="text" id="pagesInput" value="" placeholder="1-3, 5" autocomplete="off" spellcheck="false" disabled>
            <div class="hint" data-i18n="pagesHint"></div>
            <div class="range-error hidden" id="pagesError" role="alert"></div>
          </div>

          <div class="summary" id="summary" aria-live="polite"></div>
        </div>

        <div class="preview">
          <div class="preview-title" id="previewTitle"></div>
          <div class="preview-stage">
            <div class="preview-paper loading" id="previewPaper"><canvas class="overlay" id="overlay"></canvas></div>
          </div>
        </div>
      </div>
    </section>
  </div>

  <!-- Libraries (loaded from cdnjs, pinned versions) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
  <script src="script.js"></script>
<script src="../assets/tools.js"></script>
<script src="../assets/site.js"></script>
</body>
</html>
